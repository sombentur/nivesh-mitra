# Which companies belong to which sector.
#
# The sector tiles on the dashboard show NSE's sector indices. Clicking one opens the tracked companies whose main
# business is that sector. The grouping below is Nivesh Mitra's own classification by main business, not NSE's official
# member list for the index (NSE reviews its index members every March and September), so the two can differ a little.
# Only the 200 most-traded NSE stocks are tracked; a tracked company that is missing from `companies` is reported as
# "not classified yet" on the sectors page, so gaps are visible rather than silent.
#
# To add a company: companies: SYMBOL: industry   (industry keys are listed under `industries`).

checked: 2026-10-06

# industry key: plain-language label
industries:
  private_bank: Private banks
  psu_bank: Public-sector banks
  nbfc: Lenders (NBFCs, housing & power finance)
  insurance: Insurance
  asset_management: Asset & wealth management
  capital_markets: Exchanges, depositories & brokers
  fintech: Payments & fintech
  it_services: IT services & software
  it_hardware: IT hardware & distribution
  auto: Vehicle makers
  auto_parts: Auto parts
  pharma: Medicine makers
  hospitals: Hospitals
  fmcg: Packaged foods, drinks & household goods
  retail: Retail, apparel & jewellery
  consumer_durables: Paints, appliances & home products
  metals: Steel, aluminium, zinc & pipes
  mining: Coal & mining
  oil_gas: Oil, gas & refining
  power: Power generation & transmission
  cement: Cement
  chemicals: Chemicals, agrochemicals & adhesives
  realty: Property developers
  media: Media & entertainment
  capital_goods: Engineering, construction & machinery
  defence: Defence & shipbuilding
  electricals: Electrical equipment, cables & solar gear
  electronics: Electronics manufacturing
  infrastructure: Ports, airports & infrastructure
  telecom: Telecom
  internet: Internet platforms & e-commerce
  travel: Travel, hotels & logistics

# A sector page = one or more industries. `index` is the NSE sector index shown on its dashboard tile (optional).
sectors:
  banks:
    label: Banks
    index: BANKNIFTY
    index_name: Nifty Bank
    about: Private and public-sector banks.
    industries: [private_bank, psu_bank]
  private_banks:
    label: Private banks
    index: NIFTYPVTBANK
    index_name: Nifty Private Bank
    about: Banks owned by private shareholders.
    industries: [private_bank]
  psu_banks:
    label: PSU banks
    index: NIFTYPSUBANK
    index_name: Nifty PSU Bank
    about: Banks where the government holds the majority.
    industries: [psu_bank]
  financials:
    label: Financials
    index: FINNIFTY
    index_name: Nifty Financial Services
    about: Banks, lenders, insurers, fund houses, exchanges and payment companies.
    industries: [private_bank, psu_bank, nbfc, insurance, asset_management, capital_markets, fintech]
  it:
    label: IT
    index: NIFTYIT
    index_name: Nifty IT
    about: Software services and IT hardware.
    industries: [it_services, it_hardware]
  auto:
    label: Auto
    index: NIFTYAUTO
    index_name: Nifty Auto
    about: Vehicle makers and the companies that supply their parts.
    industries: [auto, auto_parts]
  pharma:
    label: Pharma
    index: NIFTYPHARMA
    index_name: Nifty Pharma
    about: Medicine makers, with hospital chains listed alongside (the index itself holds only medicine makers).
    industries: [pharma, hospitals]
  fmcg:
    label: FMCG
    index: NIFTYFMCG
    index_name: Nifty FMCG
    about: Everyday goods — foods, drinks, cigarettes, soaps and household products.
    industries: [fmcg]
  metals:
    label: Metals
    index: NIFTYMETAL
    index_name: Nifty Metal
    about: Steel, aluminium, zinc, copper, pipes and mining.
    industries: [metals, mining]
  realty:
    label: Realty
    index: NIFTYREALTY
    index_name: Nifty Realty
    about: Companies that build and sell homes, offices and malls.
    industries: [realty]
  media:
    label: Media
    index: NIFTYMEDIA
    index_name: Nifty Media
    about: Television, films, music and gaming.
    industries: [media]
  commodities:
    label: Commodities
    index: NIFTYCDTY
    index_name: Nifty Commodities
    about: Oil and gas, power, cement, chemicals, metals and mining — businesses that live on raw-material prices.
    industries: [oil_gas, power, cement, chemicals, metals, mining]
  industrials:
    label: Industrials & defence
    about: Engineering, machinery, electrical equipment, electronics manufacturing, defence and infrastructure. No single NSE index on the dashboard covers this group.
    industries: [capital_goods, defence, electricals, electronics, infrastructure]
  consumer:
    label: Consumer & retail
    about: Shops, apparel, jewellery, paints and appliances. No single NSE index on the dashboard covers this group.
    industries: [retail, consumer_durables]
  telecom_internet:
    label: Telecom, internet & travel
    about: Telecom operators, internet platforms, airlines, hotels and logistics. No single NSE index on the dashboard covers this group.
    industries: [telecom, internet, travel]

